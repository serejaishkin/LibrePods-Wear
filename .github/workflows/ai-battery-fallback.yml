name: Apply Wear battery fallback

on:
  push:
    branches:
      - wearos/initial-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: integrate bounded AACP battery fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wearos/initial-cleanup
          fetch-depth: 0
      - name: Patch controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/me/kavishdevar/librepods/wear/core/AirPodsController.kt')
          s=p.read_text()
          old='''    private val gattBatteryReader = BLEGattBatteryReader(context)\n    private var gattPollJob: Job? = null\n'''
          new='''    private val gattBatteryReader = BLEGattBatteryReader(context)\n    private var gattPollJob: Job? = null\n    private var aacpBatteryReceived = false\n    private var fallbackStartedForAddress: String? = null\n'''
          s=s.replace(old,new,1)
          old='''        override fun onBatteryInfoReceived(batteryInfo: ByteArray) {\n            recordPacket(batteryInfo)\n            val parsed = AirPodsProtocolDiagnostics.parseBattery(batteryInfo) ?: return\n'''
          new='''        override fun onBatteryInfoReceived(batteryInfo: ByteArray) {\n            recordPacket(batteryInfo)\n            aacpBatteryReceived = true\n            gattPollJob?.cancel()\n            gattPollJob = null\n            val parsed = AirPodsProtocolDiagnostics.parseBattery(batteryInfo) ?: return\n'''
          s=s.replace(old,new,1)
          old='''            internalStateStore.update { it.copy(protocolStage = "READY", connecting = false, connected = true, lastError = null) }\n                            refreshState()\n                            initializeAtt()\n'''
          new='''                            internalStateStore.update { it.copy(protocolStage = "READY", connecting = false, connected = true, lastError = null) }\n                            refreshState()\n                            initializeAtt()\n                            scheduleBatteryFallbackIfNeeded(device.address)\n'''
          if old not in s:
              old='''                            internalStateStore.update { it.copy(protocolStage = "READY", connecting = false, connected = true, lastError = null) }\n                            refreshState()\n                            initializeAtt()\n'''
              new='''                            internalStateStore.update { it.copy(protocolStage = "READY", connecting = false, connected = true, lastError = null) }\n                            refreshState()\n                            initializeAtt()\n                            scheduleBatteryFallbackIfNeeded(device.address)\n'''
          s=s.replace(old,new,1)
          start=s.index('    private fun startBatteryRefresh(address: String) {')
          end=s.index('    @SuppressLint("MissingPermission")\n    private suspend fun connectTransport', start)
          replacement='''    private fun startBatteryRefresh(address: String) {\n        gattPollJob?.cancel()\n        gattPollJob = null\n        fallbackStartedForAddress = null\n        aacpBatteryReceived = false\n        // Classic Bluetooth battery events remain event-driven; do not start a GATT loop here.\n        Log.d(tag, "Battery refresh armed for $address; waiting for AACP or explicit fallback")\n    }\n\n    private fun scheduleBatteryFallbackIfNeeded(address: String) {\n        if (manualDisconnect || aacpBatteryReceived || fallbackStartedForAddress == address) return\n        fallbackStartedForAddress = address\n        gattPollJob?.cancel()\n        gattPollJob = scope.launch {\n            // Give the normal AACP notification path a short window first.\n            delay(2_000)\n            if (manualDisconnect || aacpBatteryReceived || internalStateStore.state.value.protocolStage != "READY") return@launch\n            Log.i(tag, "AACP battery not received; starting one-shot GATT fallback for $address")\n            readGattBatteryOnce(address)\n            gattPollJob = null\n        }\n    }\n\n    private fun readGattBatteryOnce(address: String) {\n        gattBatteryReader.readBattery(address, object : BLEGattBatteryReader.BatteryCallback {\n            override fun onBatteryRead(left: Int?, right: Int?, case: Int?) {\n                if (!manualDisconnect && !aacpBatteryReceived) {\n                    applyGattBattery(left, right, case, address)\n                }\n            }\n            override fun onReadFailed(reason: String) {\n                Log.w(tag, "GATT battery fallback failed for $address: $reason")\n            }\n        })\n    }\n\n'''
          s=s[:start]+replacement+s[end:]
          old='''                            startBatteryRefresh(device.address)\n                            Log.i(tag, "ACL_CONNECTED: set CLASSIC_CONNECTED for ${device.address}")'''
          new='''                            startBatteryRefresh(device.address)\n                            Log.i(tag, "ACL_CONNECTED: set CLASSIC_CONNECTED for ${device.address}")'''
          s=s.replace(old,new,1)
          old='''        gattPollJob?.cancel(); gattPollJob = null; gattBatteryReader.cleanup()'''
          new='''        gattPollJob?.cancel(); gattPollJob = null; fallbackStartedForAddress = null; aacpBatteryReceived = false; gattBatteryReader.cleanup()'''
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Update roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/AI_ROADMAP_2026-08-21.md')
          s=p.read_text()
          s=s.replace('- `BLEGattBatteryReader` is now explicitly a bounded, single-shot reader: it performs one connection/service-discovery/read sequence and does not own a polling loop.','- `BLEGattBatteryReader` is now explicitly a bounded, single-shot reader: it performs one connection/service-discovery/read sequence and does not own a polling loop.\n- `AirPodsController` now gives AACP battery notifications priority and schedules at most one delayed GATT fallback read after AACP reaches READY; the fallback uses the same `AirPodsState` and is cancelled on disconnect.')
          s=s.replace('1. **AACP battery fallback integration** — the reader itself is now one-shot, but `AirPodsController` still contains the old periodic polling path. Replace that controller polling with a bounded fallback triggered after AACP READY when no AACP battery notification has arrived. It must update the existing `AirPodsState`, never replace the AACP source, and be cancelled on disconnect.','1. **AACP battery fallback integration** — implemented as a bounded one-shot fallback after AACP READY when no AACP battery notification arrives. AACP remains authoritative; the fallback updates the existing `AirPodsState` and is cancelled on disconnect.')
          s=s.replace('2. **Charging from fallback** — do not invent charging flags from an unverified GATT payload. Keep the existing AACP charging flags authoritative and only add fallback charging when a verified GATT source is available.','2. **Charging from fallback** — AACP charging flags remain authoritative. GATT fallback does not invent charging state.')
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/me/kavishdevar/librepods/wear/core/AirPodsController.kt android/AI_ROADMAP_2026-08-21.md .github/workflows/ai-battery-fallback.yml
          git commit -m "feat: integrate bounded AACP battery fallback"
          git push origin wearos/initial-cleanup
